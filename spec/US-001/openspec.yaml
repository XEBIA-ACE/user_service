  title: New User Registration Form Submission (Happy Path)
  description: 'Covers the end-to-end happy-path registration flow: the user fills
    in the registration form (full name, email, password), accepts ToS/privacy consent,
    submits the form, and receives confirmation that their account has been created.
    In scope: form rendering with mandatory fields (full name, email, password — per
    REC-01 assumption), client-side field-level validation feedback, successful form
    submission resulting in account creation, and post-registration session behaviour
    applied per REC-05. Out of scope: server-side validation logic (covered as tasks),
    password hashing internals, wishlist provisioning trigger, and duplicate/error
    path handling (covered in US-02 and US-03).'
